name: OnyxSi CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: AST Boot & Zero-Dep Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: AST Compliance Auditor (Zero-Dependency & Zero-UI)
        run: |
          python src/onyxsi/auditor.py

      - name: Standalone Spec Test Runner (Zero External Dependencies)
        run: |
          python tests/run_tests.py

  matrix-test:
    name: Test Matrix (${{ matrix.os }} - Py ${{ matrix.python-version }})
    needs: audit
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
        include:
          - os: ubuntu-latest
            python-version: "3.14-dev"
            experimental: true
    continue-on-error: ${{ matrix.experimental || false }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Standalone Spec Tests (0 Dependencies)
        run: |
          python tests/run_tests.py

      - name: Install Pytest Harness
        run: |
          python -m pip install --upgrade pip
          pip install -e .[test]

      - name: Run Full Pytest Suite (669 Tests)
        run: |
          pytest tests/ --tb=short

      - name: Headless Stdio Smoke Test
        run: |
          python -c "import sys; sys.path.insert(0, 'src'); import onyxsi; print('OnyxSi Version:', getattr(onyxsi, '__version__', '1.0.0'))"
